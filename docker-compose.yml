version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./retail_sentinel.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./uploads:/app/uploads
      - ./retail_sentinel.db:/app/retail_sentinel.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
